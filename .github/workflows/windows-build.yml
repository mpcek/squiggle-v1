name: SQUIGGLE! Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure CMake (fetches JUCE 8.0.6)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SQUIGGLE-0.4.0-Windows
          path: |
            build/Squiggle_artefacts/Release/VST3/SQUIGGLE!.vst3
            build/Squiggle_artefacts/Release/Standalone/SQUIGGLE!.exe
          if-no-files-found: error
          retention-days: 14
